# ruff: same version in pyproject.toml (dev group) and .github/workflows/ci.yml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  # About 2 s; catches an avoided glossary term before a sim run or a PR
  - repo: local
    hooks:
      - id: glossary-terms
        name: glossary terms
        entry: uv run pytest -q tests/test_glossary_terms.py
        language: system
        pass_filenames: false
        always_run: true
