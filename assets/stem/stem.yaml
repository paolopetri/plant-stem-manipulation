# Nominal stem, model v1: Newton cable (chain of capsule segments with cable joints, VBD solver).
# Read by src/stem_manip/assets/stem.py. Values are chosen in M1 (see docs/TODO.md); null = not set yet.
# Units: SI (m, kg/m^3, Pa, 1/m).

geometry:
  length: null            # [m] base to tip
  num_segments: null      # number of capsule segments (control points = num_segments + 1)
  diameter: null          # [m] -> CableMaterialCfg.thickness
  base_position: null     # [x, y, z] in the env frame [m]

material:
  density: null           # [kg/m^3]
  stretch_modulus: null   # [Pa] -> CableMaterialCfg.stretch_stiffness
  bend_modulus: null      # [Pa] -> CableMaterialCfg.bend_stiffness
  twist_modulus: null     # [Pa] -> CableMaterialCfg.twist_stiffness (null = solver fallback to bend)

damage:
  max_curvature: null     # [1/m] hard limit (= 1 / minimum bending radius), used for termination and penalty
