# The plant stem, shared by all stem models. Each model adds its own values in assets/stem/<model>/<model>.yaml
# (same sections; a key is defined in exactly one of the two files). Read by src/stem_manip/assets/stem/.
# Units: SI (m, kg/m^3, Pa, 1/m).
# PLACEHOLDER values: chosen to check the code, not measured on a plant. They will be domain-randomized.
# The stem is treated as a thin rod: it bends and twists, stretch and shear are negligible.

geometry:
  length: 0.4             # [m] base to tip
  diameter: 0.008         # [m]
  base_position: [0.5, 0.0, 0.0]  # [x, y, z] in the env frame [m]

material:
  density: 1000.0         # [kg/m^3]
  bend_modulus: 5.0e+8    # [Pa] E; joint bend stiffness E I / l
  twist_modulus: null     # [Pa] G; joint twist stiffness G J / l (null = twist stiffness equal to bend stiffness)
  damping_time: 0.0032    # [s] stiffness-proportional damping of bend and twist: damping = damping_time * stiffness
                          # (bend: tau*E*I, twist: tau*G*J); null = no damping

damage:                   # hard limits, used for termination and penalty (see docs/architecture.md)
  max_curvature: 5.0      # [1/m] bending (= 1 / minimum bending radius); stage 1 starts with this one
  max_twist_rate: null    # [rad/m] torsion
  max_tensile_stress: null  # [Pa] tension from pulling / dragging along the stem (tearing)
