# Nominal stem, model v1: Newton cable (chain of capsule segments with cable joints, VBD solver).
# Read by src/stem_manip/assets/stem.py. Values are chosen in M1 (see docs/TODO.md); null = not set yet.
# Units: SI (m, kg/m^3, Pa, 1/m).
# PLACEHOLDER values: chosen to check the code, not measured on a plant. Replace once a reference plant is fixed.

geometry:
  length: 0.4             # [m] base to tip
  num_segments: 20        # number of capsule segments (control points = num_segments + 1)
  diameter: 0.008         # [m] -> CableMaterialCfg.thickness
  base_position: [0.5, 0.0, 0.0]  # [x, y, z] in the env frame [m]

material:
  density: 1000.0         # [kg/m^3]
  stretch_modulus: 5.0e+8 # [Pa] -> CableMaterialCfg.stretch_stiffness
  bend_modulus: 5.0e+8    # [Pa] -> CableMaterialCfg.bend_stiffness
  twist_modulus: null     # [Pa] -> CableMaterialCfg.twist_stiffness (null = solver fallback to bend)
  damping_time: 0.0032    # [s] stiffness-proportional damping: damping = damping_time * stiffness, per mode
                          # (bend: tau*E*I, stretch: tau*E*A, twist: tau*G*J); null = no damping

damage:                   # hard limits, used for termination and penalty (see docs/architecture.md)
  max_curvature: 5.0      # [1/m] bending (= 1 / minimum bending radius); stage 1 starts with this one
  max_twist_rate: null    # [rad/m] torsion
  max_tensile_stress: null  # [Pa] tension from pulling / dragging along the stem (tearing); stress = stretch_modulus * axial strain
