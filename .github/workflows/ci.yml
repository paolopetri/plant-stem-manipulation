name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.9 check .
      - run: uvx ruff@0.16.9 format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Read the recorded Isaac Lab commit
        id: lab
        run: echo "commit=$(cat ISAACLAB_COMMIT)" >> "$GITHUB_OUTPUT"
      # pyproject.toml points at ../IsaacLab, which is outside the workspace (actions/checkout cannot put it there)
      - name: Restore the Isaac Lab checkout
        id: lab-cache
        uses: actions/cache@v4
        with:
          path: ../IsaacLab
          key: isaaclab-${{ steps.lab.outputs.commit }}
      - name: Check out Isaac Lab
        if: steps.lab-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/isaac-sim/IsaacLab.git ../IsaacLab
          git -C ../IsaacLab checkout ${{ steps.lab.outputs.commit }}
      - run: uv sync --extra rsl-rl
      # The tests read assets/fr3/build/fr3_<ee>.urdf (git-ignored, built from the base URDF and franka_description)
      - name: Build the FR3 URDFs
        run: |
          git clone https://github.com/frankarobotics/franka_description.git ../franka_description
          git -C ../franka_description checkout 7aeeddc449edf8d62b594f9e36a81da53e7796f9
          cd assets/fr3
          for ee in fork fork_v2; do
            uv run build_asset.py --ee $ee --franka-description ../../../franka_description
          done
      - run: uv run pytest
